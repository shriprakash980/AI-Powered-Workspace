name: DevPilot AI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate HTML & CSS Standards
        run: |
          echo "Validating HTML5 and CSS3 file syntax..."
          test -f frontend/index.html
          test -f frontend/workspace.html
          test -f frontend/dashboard.html

  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          if [ -f backend/pom.xml ]; then
            cd backend && mvn clean test
          else
            echo "Backend pom.xml scheduled for Phase 3."
          fi
