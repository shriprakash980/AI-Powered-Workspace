global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'devpilot-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['devpilot-backend:8080', 'localhost:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
