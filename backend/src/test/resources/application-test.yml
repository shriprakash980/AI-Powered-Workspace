spring:
  datasource:
    url: jdbc:h2:mem:devpilot_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  security:
    jwt-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    jwt-access-token-expiration: 900000
    jwt-refresh-token-expiration: 604800000
  ai:
    default-provider: OPENAI
    timeout-seconds: 10
    fallback-enabled: true
    openai:
      api-key: ""
      model: gpt-4o-mini
    gemini:
      api-key: ""
      model: gemini-1.5-flash
    anthropic:
      api-key: ""
      model: claude-3-5-sonnet-20241022
  git:
    workspace-root: ${java.io.tmpdir}/devpilot-test-workspaces
    max-repo-size-mb: 500
    max-file-count: 10000
    max-file-size-mb: 25
  github:
    client-id: "test-client-id"
    client-secret: "test-client-secret"
    redirect-uri: "http://localhost:5500/settings.html?github=callback"
    encryption-key: "devpilot-test-encryption-key-32c!"
    api-base-url: "https://api.github.com"

